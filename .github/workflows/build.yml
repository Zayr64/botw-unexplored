name: Build

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y g++ libglm-dev
      - run: bash tests/run_host_tests.sh
      - run: SANITIZE=1 bash tests/run_host_tests.sh

  switch-build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64@sha256:1fc388c3a0d34bd2045a6dadcb1020e069d5f876a187fd705de14b4440c00282
    steps:
      - uses: actions/checkout@v7
      - run: make
      - uses: actions/upload-artifact@v7
        with:
          name: botw-unexplored-nro
          path: botw-unexplored.nro

  overlay-build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64@sha256:1fc388c3a0d34bd2045a6dadcb1020e069d5f876a187fd705de14b4440c00282
    steps:
      - uses: actions/checkout@v7
      - name: libnx v4.12.0 (newer than the container's, for libultrahand 2.5.3)
        run: |
          git config --global --add safe.directory "*"
          git clone --depth 1 --branch v4.12.0 https://github.com/switchbrew/libnx.git /tmp/libnx
          make -C /tmp/libnx install -j"$(nproc)"
      - name: libultrahand v2.5.3 (same version as Ultrahand on the console)
        run: git clone --depth 1 --branch v2.5.3 https://github.com/ppkantorski/libultrahand.git overlay/libs/libultrahand
      - run: make -C overlay -j"$(nproc)"
      - uses: actions/upload-artifact@v7
        with:
          name: botw-unexplored-ovl
          path: overlay/out/ovlBotwUnexplored.ovl
